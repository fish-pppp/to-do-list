@if (showCloudBackup) {
<section class="cloud-sync">
  <h3>{{ T.FILE_IMEX.CLOUD_TITLE | translate }}</h3>
  <p>{{ T.FILE_IMEX.CLOUD_HINT | translate }}</p>
  <label for="cloud-sync-key">{{ T.FILE_IMEX.CLOUD_KEY_LABEL | translate }}</label>
  <input
    id="cloud-sync-key"
    type="password"
    autocomplete="off"
    [(ngModel)]="cloudSyncKey"
  />
  <div>
    <button
      (click)="saveCloudSyncKey()"
      color="primary"
      mat-stroked-button
      type="button"
    >
      <mat-icon>vpn_key</mat-icon>
      {{ T.FILE_IMEX.CLOUD_SAVE_KEY | translate }}
    </button>
    <button
      (click)="uploadToCloud()"
      color="primary"
      mat-stroked-button
      type="button"
    >
      <mat-icon>cloud_upload</mat-icon>
      {{ T.FILE_IMEX.CLOUD_SAVE | translate }}
    </button>
    <button
      (click)="restoreFromCloud()"
      color="primary"
      mat-stroked-button
      type="button"
    >
      <mat-icon>cloud_download</mat-icon>
      {{ T.FILE_IMEX.CLOUD_RESTORE | translate }}
    </button>
  </div>
</section>
}

<button
  (click)="downloadBackup()"
  color="primary"
  mat-stroked-button
  type="button"
>
  <mat-icon>file_upload</mat-icon>
  {{ T.FILE_IMEX.EXPORT_DATA | translate }}
</button>

<button
  (click)="privacyAppDataDownload()"
  color="primary"
  mat-stroked-button
  type="button"
  [matTooltip]="T.FILE_IMEX.PRIVACY_EXPORT_DESCRIPTION | translate"
>
  <mat-icon>code</mat-icon>
  {{ T.FILE_IMEX.PRIVACY_EXPORT | translate }}
</button>

<button
  (click)="fileInput.click()"
  color="primary"
  mat-stroked-button
  type="button"
>
  <mat-icon>file_download</mat-icon>
  {{ T.FILE_IMEX.IMPORT_FROM_FILE | translate }}
</button>

<input
  #fileInput
  (change)="handleFileInput($event)"
  hidden
  id="file"
  type="file"
/>

<button
  (click)="openUrlImportDialog()"
  color="primary"
  mat-stroked-button
  type="button"
>
  <mat-icon>cloud_download</mat-icon>
  {{ T.FILE_IMEX.OPEN_IMPORT_FROM_URL_DIALOG | translate }}
</button>

<button
  (click)="openArchiveCompression()"
  color="primary"
  mat-stroked-button
  type="button"
>
  <mat-icon>compress</mat-icon>
  {{ T.FILE_IMEX.BTN_COMPRESS_ARCHIVE | translate }}
</button>

<button
  (click)="openTodoistImport()"
  color="primary"
  mat-stroked-button
  type="button"
>
  <mat-icon>move_to_inbox</mat-icon>
  {{ T.FILE_IMEX.IMPORT_FROM_TODOIST | translate }}
</button>
